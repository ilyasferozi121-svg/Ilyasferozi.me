---
layout: default
---
<section class="page-hero wrap">
  <nav class="breadcrumb" aria-label="Breadcrumb"><a href="{{ '/' | relative_url }}">Home</a><span aria-hidden="true">/</span><span>{{ page.title | escape }}</span></nav>
  <div class="eyebrow">{{ page.eyebrow | default: page.title | escape }}</div>
  <h1>{{ page.heading | default: page.title | escape }}</h1>
  {% if page.intro %}<p class="page-lead">{{ page.intro | escape }}</p>{% endif %}
</section>
<div class="page-content wrap">{{ content }}</div>
